name: Watchtower Release On Merge Example

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  release-watchtower-claim:
    name: Release Watchtower Claim
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Create release branch
        shell: bash
        run: |
          BRANCH="watchtower/release-pr-${{ github.event.pull_request.number }}"
          git switch -c "$BRANCH"
          echo "WATCHTOWER_RELEASE_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Release claim locally
        shell: bash
        run: |
          # Example only. Review workflow permissions before enabling automation.
          # This workflow must never push directly to the protected default branch.
          node watchtower-kit/scripts/watchtower.example.js release \
            --branch "${{ github.event.pull_request.head.ref }}" \
            --pr "${{ github.event.pull_request.number }}"

      - name: Commit release artifact on release branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Watchtower release changes to commit."
            exit 0
          fi

          git config user.name "watchtower-example-bot"
          git config user.email "watchtower-example-bot@example.invalid"
          git add .watchtower
          git commit -m "chore(watchtower): release claim for PR #${{ github.event.pull_request.number }}"
          git push --set-upstream origin "$WATCHTOWER_RELEASE_BRANCH"

      - name: Open release pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet origin/${{ github.event.repository.default_branch }}...HEAD; then
            echo "No release PR needed."
            exit 0
          fi

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$WATCHTOWER_RELEASE_BRANCH" \
            --title "chore(watchtower): release claim for PR #${{ github.event.pull_request.number }}" \
            --body "Release Watchtower claim after merged PR #${{ github.event.pull_request.number }}. This PR is generated by the example workflow so the release artifact goes through the normal review and merge path."
