name: Watchtower Scope Check Example

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  watchtower-scope-check:
    name: Watchtower Scope Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed files
        id: changed
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed-files.txt
          cat changed-files.txt

      - name: Check Watchtower scope
        shell: bash
        run: |
          # Example only. Adapt the branch/claim lookup to your repository.
          node watchtower-kit/scripts/watchtower.example.js check-scope \
            --branch "${{ github.head_ref }}" \
            --files-from changed-files.txt
